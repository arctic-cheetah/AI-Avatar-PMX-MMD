<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yidhari</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="view"></canvas>
  <div id="expression-controls" role="group" aria-label="Expression previews">
    <button id="happy-button" data-expression="happy" type="button" aria-pressed="false" disabled>[happy] · 笑い</button>
    <button id="surprised-button" data-expression="surprised" type="button" aria-pressed="false" disabled>[surprised] · びっくり</button>
    <button id="thinking-button" data-expression="thinking" type="button" aria-pressed="false" disabled>[thinking] · じと目</button>
    <button id="troubled-button" data-expression="troubled" type="button" aria-pressed="false" disabled>[troubled] · 困る</button>
    <button id="angry-button" data-expression="angry" type="button" aria-pressed="false" disabled>[angry] · 怒り + 怒り目</button>

  </div>
  <p id="status" role="status">Starting…</p>
  <p id="hint">Drag to orbit · scroll to zoom</p>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
